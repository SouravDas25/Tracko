#logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.liquibase=INFO
liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.profiles.default=dev
#spring.jackson.serialization.fail-on-empty-beans=false
hibernate.dialect=org.hibernate.dialect.PostgreSQL94Dialect
jwt.secret=${JWT_SECRET}
jwt.token.validity=${JWT_TOKEN_VALIDITY:86400}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Login lockout (brute-force protection) — exponential backoff per account, capped at ~1 week
security.lockout.enabled=${LOGIN_LOCKOUT_ENABLED:true}
security.lockout.max-attempts=${LOGIN_LOCKOUT_MAX_ATTEMPTS:5}
security.lockout.base-lock-seconds=${LOGIN_LOCKOUT_BASE_SECONDS:60}
security.lockout.max-lock-seconds=${LOGIN_LOCKOUT_MAX_SECONDS:604800}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha