databaseChangeLog:
    -   changeSet:
            id: 007-add-transaction-history
            author: sd25
            changes:
                # Change-history / recycle-bin for transactions. Each row is a snapshot
                # of a transaction (and, for transfers, both linked sides) taken before an
                # UPDATE/DELETE (or after a CREATE). No FK on transaction_id so DELETE
                # history survives after the transaction row is hard-deleted.
                -   createTable:
                        tableName: transaction_history
                        columns:
                            -   column:
                                    name: id
                                    type: BIGINT
                                    autoIncrement: true
                                    constraints:
                                        primaryKey: true
                                        nullable: false
                            -   column:
                                    name: transaction_id
                                    type: BIGINT
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: user_id
                                    type: VARCHAR(36)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: operation
                                    type: VARCHAR(16)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: snapshot
                                    type: ${clob.type}
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: linked_transaction_id
                                    type: BIGINT
                            -   column:
                                    name: changed_at
                                    type: timestamp
                                    defaultValueComputed: CURRENT_TIMESTAMP
                                    constraints:
                                        nullable: false
                -   addForeignKeyConstraint:
                        baseTableName: transaction_history
                        baseColumnNames: user_id
                        referencedTableName: users
                        referencedColumnNames: id
                        constraintName: fk_transaction_history_user
                        onDelete: CASCADE
                -   createIndex:
                        tableName: transaction_history
                        indexName: idx_txn_history_user_txn
                        columns:
                            -   column:
                                    name: user_id
                            -   column:
                                    name: transaction_id
                            -   column:
                                    name: changed_at
                -   createIndex:
                        tableName: transaction_history
                        indexName: idx_txn_history_user_op
                        columns:
                            -   column:
                                    name: user_id
                            -   column:
                                    name: operation
                            -   column:
                                    name: changed_at
