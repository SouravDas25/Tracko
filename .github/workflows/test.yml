name: Pull Action on Trako

on:
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        run: mvn verify -Dspring.profiles.active=test
        working-directory: backend

  cli-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock psutil requests
          pip install ./sdk
          pip install ./cli

      - name: Run CLI tests with backend
        run: python cli/run_cli_test.py

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-backend-log
          path: cli/tests/backend.log
          if-no-files-found: warn

  frontend-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psutil

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Chrome + chromedriver
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Run Flutter E2E tests with backend
        run: xvfb-run -a python frontend/run_e2e_test.py

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-backend-log
          path: frontend/integration_test/backend.log
          if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, cli-test, frontend-e2e]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tracko:${{ github.sha }} .
